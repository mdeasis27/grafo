[project]
name = "grafo"
version = "0.1.0"
description = "Knowledge-graph RAG — entity resolution, graph traversal, and a graph-vs-vector benchmark"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grafo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
